<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📷 Scan Barcode — Expired Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f7fa;
      padding: 16px;
      font-family: 'Segoe UI', sans-serif;
    }
    .container-scan { max-width: 520px; margin: 0 auto; }
    .card { box-shadow: 0 2px 12px rgba(0,0,0,0.1); border: none; border-radius: 12px; }
    .header {
      background: linear-gradient(135deg, #0d6efd, #0dcaf0);
      color: white;
      padding: 20px;
      border-radius: 12px 12px 0 0;
      text-align: center;
    }
    .header h1 { font-size: 20px; margin: 0; }
    .header small { opacity: 0.9; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    .status-box {
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      margin-top: 12px;
    }
    .status-info { background: #cff4fc; color: #055160; }
    .status-success { background: #d1e7dd; color: #0f5132; }
    .status-error { background: #f8d7da; color: #842029; }
    .status-warning { background: #fff3cd; color: #664d03; }
    .btn-scan {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
    }
    .form-label { font-size: 13px; font-weight: 600; color: #495057; }
    .loading {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #6c757d;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container-scan">
    <div class="card">
      <div class="header">
        <h1>📷 Scan Barcode</h1>
        <small>Expired Tracker</small>
      </div>

      <div class="card-body p-3">

        <!-- STEP 1: SCAN -->
        <div id="step-scan">
          <div id="reader"></div>
          <div id="status-scan" class="status-box status-info">
            Arahkan kamera ke barcode produk
          </div>
          <button id="btn-start" class="btn btn-primary btn-scan mt-3" onclick="startScanner()">
            ▶️ Mulai Scan
          </button>
          <button id="btn-stop" class="btn btn-secondary btn-scan mt-2 d-none" onclick="stopScanner()">
            ⏹️ Hentikan Kamera
          </button>
        </div>

        <!-- STEP 2: FORM INPUT SETELAH SCAN -->
        <div id="step-form" class="d-none">
          <div class="alert alert-success py-2 mb-3">
            ✅ Barcode: <b id="barcode-show"></b>
          </div>

          <div class="mb-2">
            <label class="form-label">Article</label>
            <input type="text" id="f_article" class="form-control" readonly>
          </div>

          <div class="mb-2">
            <label class="form-label">Description</label>
            <input type="text" id="f_desc" class="form-control" readonly>
          </div>

          <div class="mb-2">
            <label class="form-label">Batch / Lot</label>
            <input type="text" id="f_batch" class="form-control" placeholder="Contoh: B2024-001">
          </div>

          <div class="mb-2">
            <label class="form-label">Tanggal Expired *</label>
            <input type="date" id="f_tgl" class="form-control" required>
          </div>

          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label">Qty *</label>
              <input type="number" id="f_qty" class="form-control" placeholder="0">
            </div>
            <div class="col-6">
              <label class="form-label">Site</label>
              <input type="text" id="f_site" class="form-control" value="2120">
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">Storage Location</label>
            <input type="text" id="f_storage" class="form-control" value="1">
          </div>

          <div class="mb-3">
            <label class="form-label">Catatan</label>
            <textarea id="f_catatan" class="form-control" rows="2" placeholder="Opsional"></textarea>
          </div>

          <button id="btn-save" class="btn btn-success btn-scan" onclick="simpanData()">
            💾 Simpan ke Google Sheets
          </button>

          <button class="btn btn-outline-secondary btn-scan mt-2" onclick="scanLagi()">
            🔄 Scan Barcode Lain
          </button>
        </div>

        <!-- STATUS AKHIR -->
        <div id="status-final" class="status-box d-none"></div>

      </div>
    </div>

    <div class="footer-note">
      Powered by html5-qrcode + Google Apps Script
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    /* ============================================================
       ⚙️ GANTI URL INI DENGAN URL WEB APP GAS KAMU
       URL berakhiran /exec
       ============================================================ */
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwGjvTVKDdpJ-nER9CpHqTpJnTwFB0xyJXzi_X3FF1W14wW7i3yCyBt07J6T0mEPTaP/exec';
    /* ============================================================ */

    let html5QrCode = null;
    let scannerActive = false;
    let lastBarcode = '';

    /* ============ SCANNER ============ */
    function startScanner() {
      if (scannerActive) return;

      if (typeof Html5Qrcode === 'undefined') {
        setStatus('scan', '❌ Library belum termuat. Cek koneksi internet.', 'error');
        return;
      }

      document.getElementById('btn-start').innerHTML = '<span class="loading"></span> Menyalakan kamera...';
      document.getElementById('btn-start').disabled = true;

      html5QrCode = new Html5Qrcode('reader');
      scannerActive = true;

      const config = {
        fps: 10,
        qrbox: { width: 260, height: 160 },
        aspectRatio: 1.0,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      };

      html5QrCode.start(
        { facingMode: 'environment' },
        config,
        onScanSuccess,
        () => {}
      ).then(() => {
        scannerActive = true;
        document.getElementById('btn-start').classList.add('d-none');
        document.getElementById('btn-stop').classList.remove('d-none');
        setStatus('scan', '📷 Kamera aktif — arahkan ke barcode', 'info');
      }).catch(err => {
        scannerActive = false;
        console.error(err);
        let msg = '❌ Tidak bisa akses kamera. ';
        const s = String(err);
        if (s.includes('NotAllowedError')) msg += 'Izin kamera ditolak. Buka Settings Chrome → Site Settings → Camera → Allow.';
        else if (s.includes('NotFoundError')) msg += 'Kamera tidak ditemukan.';
        else if (s.includes('NotReadableError')) msg += 'Kamera sedang dipakai aplikasi lain.';
        else msg += 'Detail: ' + err;
        setStatus('scan', msg, 'error');
        document.getElementById('btn-start').innerHTML = '▶️ Mulai Scan';
        document.getElementById('btn-start').disabled = false;
      });
    }

    function stopScanner() {
      return new Promise(resolve => {
        if (html5QrCode && scannerActive) {
          html5QrCode.stop().then(() => {
            try { html5QrCode.clear(); } catch(e){}
            html5QrCode = null;
            scannerActive = false;
            document.getElementById('btn-start').classList.remove('d-none');
            document.getElementById('btn-start').innerHTML = '▶️ Mulai Scan';
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').classList.add('d-none');
            resolve();
          }).catch(() => {
            html5QrCode = null;
            scannerActive = false;
            resolve();
          });
        } else {
          scannerActive = false;
          resolve();
        }
      });
    }

    function onScanSuccess(decodedText) {
      console.log('✅ Scanned:', decodedText);
      if (decodedText === lastBarcode) return;
      lastBarcode = decodedText;

      beep();
      setStatus('scan', '✅ Barcode terdeteksi: ' + decodedText, 'success');

      document.getElementById('barcode-show').textContent = decodedText;

      setStatus('final', '⏳ Mencari data produk...', 'info');
      document.getElementById('status-final').classList.remove('d-none');

      lookupBarang(decodedText);

      setTimeout(() => {
        stopScanner().then(() => {
          document.getElementById('step-scan').classList.add('d-none');
          document.getElementById('step-form').classList.remove('d-none');
          document.getElementById('status-final').classList.add('d-none');
          document.getElementById('f_tgl').focus();
        });
      }, 600);
    }

    /* ============ LOOKUP BARANG VIA JSONP ============ */
    function lookupBarang(barcode) {
      const cbName = 'gasCallback_' + Date.now();
      window[cbName] = function(data) {
        if (data && data.success && data.data) {
          document.getElementById('f_article').value = data.data.article || '';
          document.getElementById('f_desc').value = data.data.description || '';
        } else {
          document.getElementById('f_article').value = '';
          document.getElementById('f_desc').value = '';
        }
        delete window[cbName];
      };

      const script = document.createElement('script');
      script.src = GAS_URL + '?action=cari&barcode=' + encodeURIComponent(barcode) + '&callback=' + cbName;
      script.onerror = function() {
        document.getElementById('f_article').value = '';
        document.getElementById('f_desc').value = '';
      };
      document.body.appendChild(script);
    }

    /* ============ SIMPAN KE SHEET ============ */
    function simpanData() {
      const barcode = document.getElementById('barcode-show').textContent;
      const tgl = document.getElementById('f_tgl').value;
      const qty = document.getElementById('f_qty').value;

      if (!tgl) { alert('⚠️ Tanggal expired wajib diisi!'); return; }
      if (!qty || qty <= 0) { alert('⚠️ Qty wajib diisi (min. 1)!'); return; }

      const payload = {
        aksi: 'tambah',
        barcode: barcode,
        article: document.getElementById('f_article').value,
        description: document.getElementById('f_desc').value,
        batch: document.getElementById('f_batch').value,
        tglExpired: tgl,
        qty: qty,
        site: document.getElementById('f_site').value,
        storage: document.getElementById('f_storage').value,
        catatan: document.getElementById('f_catatan').value
      };

      document.getElementById('btn-save').innerHTML = '<span class="loading"></span> Menyimpan...';
      document.getElementById('btn-save').disabled = true;

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(() => {
        setStatus('final', '✅ Data berhasil dikirim ke Google Sheets!', 'success');
        document.getElementById('status-final').classList.remove('d-none');

        setTimeout(() => {
          if (confirm('✅ Data tersimpan!\n\nMau scan barcode lagi?')) {
            scanLagi();
          } else {
            document.getElementById('btn-save').innerHTML = '💾 Simpan ke Google Sheets';
            document.getElementById('btn-save').disabled = false;
          }
        }, 500);
      }).catch(err => {
        setStatus('final', '❌ Gagal kirim data: ' + err, 'error');
        document.getElementById('status-final').classList.remove('d-none');
        document.getElementById('btn-save').innerHTML = '💾 Simpan ke Google Sheets';
        document.getElementById('btn-save').disabled = false;
      });
    }

    function scanLagi() {
      lastBarcode = '';
      ['f_article','f_desc','f_batch','f_tgl','f_qty','f_catatan'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('step-form').classList.add('d-none');
      document.getElementById('step-scan').classList.remove('d-none');
      document.getElementById('status-final').classList.add('d-none');
      setStatus('scan', 'Arahkan kamera ke barcode produk', 'info');
    }

    /* ============ HELPER ============ */
    function setStatus(step, msg, type) {
      const el = document.getElementById('status-' + step);
      if (!el) return;
      el.className = 'status-box status-' + (type || 'info');
      el.textContent = msg;
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.15;
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }
  </script>
</body>
</html>
